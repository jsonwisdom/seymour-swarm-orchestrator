name: MissionState recovery tests
on:
  push:
    paths:
      - 'src/**'
      - 'test/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'vitest.config.ts'
      - '.github/workflows/recovery-tests.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
