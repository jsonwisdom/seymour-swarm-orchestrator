name: Build deployable Worker bundle
on:
  push:
    paths:
      - 'src/**'
      - 'wrangler.jsonc'
      - 'package-lock.json'
      - 'package.json'
      - '.github/workflows/build-worker-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g npm@11
      - run: npm ci --no-audit --no-fund
      - name: Build without publishing
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Preserve deployable bundle
        uses: actions/upload-artifact@v4
        with:
          name: seymour-worker-bundle
          path: dist/
          if-no-files-found: error
